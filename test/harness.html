<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Banner Channel — harness</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f5f7; padding: 24px; color: #1f1f1f; --primary-color: #03a9f4; --secondary-text-color: #727272; --info-color: #039be5; --warning-color: #ffa600; --error-color: #db4437; }
    h3 { margin: 28px 0 8px; }
    .card-wrap { max-width: 480px; margin: 0 0 8px; }
    .caption { margin: 0 0 18px; color: #5f6368; font-size: 13px; }
    button { margin: 2px; }
    ha-card { display: block; background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    ha-icon { display: inline-flex; width: 28px; height: 28px; border-radius: 50%; background: currentColor; color: #212121; }
  </style>
</head>
<body>
  <h3>Still frames</h3>
  <div id="gallery"></div>
  <h3>Live rotation</h3>
  <div>
    <button id="b3">three alerts</button>
    <button id="b1">one alert</button>
    <button id="bhide">hide</button>
    <button id="bclear">all_clear</button>
    <button id="bna">unavailable</button>
  </div>
  <div class="card-wrap"><div id="mount"></div></div>
  <pre id="log"></pre>

  <script type="module">
    // 1) Provide a real Lit and expose it the way HA does (ha-panel-lovelace prototype).
    import { LitElement, html, css }
      from "https://cdn.jsdelivr.net/npm/lit@2/+esm";
    LitElement.prototype.html = html;
    LitElement.prototype.css = css;
    if (!customElements.get("ha-panel-lovelace")) {
      customElements.define("ha-panel-lovelace", class extends LitElement {});
    }
    // 2) Stub <ha-icon>.
    if (!customElements.get("ha-icon")) {
      customElements.define("ha-icon", class extends HTMLElement {
        static get observedAttributes() { return ["icon"]; }
        connectedCallback() { this._r(); }
        attributeChangedCallback() { this._r(); }
        _r() { this.title = this.getAttribute("icon") || ""; }
      });
    }
    // 3) Log HA action events so taps are visible.
    const log = (m) => (document.getElementById("log").textContent =
      new Date().toLocaleTimeString() + "  " + m + "\n" + document.getElementById("log").textContent);
    window.addEventListener("location-changed", () => log("navigate → " + location.pathname));
    document.addEventListener("hass-more-info", (e) => log("more-info → " + e.detail.entityId));

    // 4) Load the card under test.
    await import("../custom_components/banner_channels/frontend/banner-channel-card.js");

    const mount = document.getElementById("mount");
    const entity = "sensor.banner_tablets";
    let card;
    function mk(state, attributes) {
      mount.innerHTML = "";
      card = document.createElement("banner-channel-card");
      card.setConfig({ entity });
      mount.appendChild(card);
      card.hass = {
        states: { [entity]: { state, attributes } },
        callService: (d, s, data) => log(`callService ${d}.${s} ${JSON.stringify(data)}`),
      };
    }
    const three = [
      {
        id: "leak",
        icon: "mdi:water-alert",
        primary: "Basement leak",
        secondary: "Sensor 3 · 2m ago",
        background: "#ffebee",
        color: "#e53935",
        severity: "problem",
        tap_action: { action: "more-info", entity: "binary_sensor.basement_leak" },
      },
      {
        id: "garage",
        icon: "mdi:garage-open",
        primary: "Garage door open",
        secondary: "14 min",
        severity: "warning",
        tap_action: { action: "more-info", entity: "cover.garage_door" },
      },
      {
        id: "battery",
        icon: "mdi:battery-alert",
        primary: "Front lock battery low",
        secondary: "12%",
        severity: "info",
        tap_action: { action: "more-info", entity: "sensor.front_lock_battery" },
      },
    ];
    function feed(extra) {
      return {
        rotate_interval: 2,
        show_badge: true,
        empty: "hide",
        all_clear: null,
        alerts: [],
        ...extra,
      };
    }
    document.getElementById("b3").onclick = () => mk("3", feed({ alerts: three }));
    document.getElementById("b1").onclick = () => mk("1", feed({ alerts: [three[0]] }));
    document.getElementById("bhide").onclick = () => mk("0", feed({ alerts: [], empty: "hide" }));
    document.getElementById("bclear").onclick = () => mk("0", feed({
      alerts: [],
      empty: "all_clear",
      all_clear: { icon: "mdi:check-circle", text: "All clear" },
    }));
    document.getElementById("bna").onclick = () => mk("unavailable", feed({ alerts: [] }));

    const nine = Array.from({ length: 9 }, (_, index) => ({
      ...three[index % three.length],
      id: "slide-" + (index + 1),
      primary: three[index % three.length].primary + " " + (index + 1),
    }));
    const gallery = document.getElementById("gallery");
    function still(caption, state, attributes, index) {
      const wrap = document.createElement("div");
      wrap.className = "card-wrap";
      const note = document.createElement("p");
      note.className = "caption";
      note.textContent = caption;
      gallery.append(wrap, note);
      const stillCard = document.createElement("banner-channel-card");
      stillCard.setConfig({ entity });
      wrap.appendChild(stillCard);
      stillCard.hass = {
        states: { [entity]: { state, attributes } },
        callService: () => {},
      };
      if (index) {
        stillCard._index = index;
        stillCard.requestUpdate();
      }
    }
    still("Slide 3 of 9. The counter is the current slide, not the old total.", "9", feed({ rotate_interval: 0, alerts: nine }), 2);
    still("Warning, no custom color. Accent bar on the left.", "3", feed({ rotate_interval: 0, alerts: three }), 1);
    still("One alert. The counter stays hidden.", "1", feed({ rotate_interval: 0, alerts: [three[2]] }));
    const defaults = {
      info: { icon: "mdi:information-outline", color: "#0277bd" },
      warning: { icon: "mdi:alert-outline", color: "#ef6c00" },
      problem: { icon: "mdi:alert-circle", color: "#c62828" },
    };
    still("Channel defaults. Blank rule icon and no text color use the warning icon and color.", "1", feed({
      rotate_interval: 0,
      severity_styles: defaults,
      alerts: [{
        id: "default-warning",
        icon: "",
        primary: "Garage door open",
        secondary: "Uses the channel warning default",
        severity: "warning",
      }],
    }));
    still("The rule icon and text color replace the channel defaults.", "1", feed({
      rotate_interval: 0,
      severity_styles: defaults,
      alerts: [{
        id: "override",
        icon: "mdi:garage-open",
        primary: "Garage door open",
        secondary: "Rule icon and purple text win",
        color: "#8e24aa",
        severity: "warning",
      }],
    }));
    still("Custom text color. The label and the counter use that color.", "2", feed({
      rotate_interval: 0,
      alerts: [{
        id: "custom",
        icon: "mdi:alert",
        primary: "Problem, custom text color",
        secondary: "Label and counter follow #8e24aa",
        color: "#8e24aa",
        severity: "problem",
      }, three[1]],
    }));
    mk("3", feed({ alerts: three }));
  </script>
</body>
</html>
